          description: Амжилттай устгалаа. Body хоосон.
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
      parameters:
        - $ref: "#/components/parameters/Id"
      description: Сургалт устахад түүний бүх хичээл хамт устна (Cascade).
  /categories/{id}/courses:
