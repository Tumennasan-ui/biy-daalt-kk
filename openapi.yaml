openapi: 3.0.3
info:
  title: Онлайн сургалтын API
  version: 1.0.0
  description: "BED411 бие даалт. Оюутны кодын сүүлийн цифр 1: Category, Instructor, Course, Lesson.
    21 domain endpoint. Бүх жагсаалт data/meta хэлбэртэй. Бүх алдаа message болон шаардлагатай үед
    field талбартай. Үл мэдэгдэх эсвэл давтагдсан query параметр 400. Жилийн дээд хязгаарыг сервер
    ажиллаж буй оноор тооцно: year нь ирэх он хүртэл, birthYear нь энэ он хүртэл."
servers:
  - url: /
    description: Одоогийн сервер; /docs дээр Try it out шууд ажиллана.
tags:
  - name: Categories
    description: Сургалтын ангилал
  - name: Instructors
    description: Багш
  - name: Courses
    description: Сургалт
  - name: Lessons
    description: Хичээл
paths:
  /categories:
    get:
      tags:
        - Categories
      summary: Category жагсаах
      operationId: listCategories
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryList"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
    post:
      tags:
        - Categories
      summary: Category нэмэх
      operationId: createCategory
      responses:
        "201":
          description: Үүсгэлээ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "409":
          description: Давхардсан утга эсвэл устгахыг хориглосон холбоос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Conflicting data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
            example:
              name: Программчлал
  /categories/{id}:
    get:
      tags:
        - Categories
      summary: Category дэлгэрэнгүй
      operationId: getCategory
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryDetail"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
      parameters:
        - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Categories
      summary: Category хэсэгчлэн засах
      operationId: updateCategory
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
        "409":
          description: Давхардсан утга эсвэл устгахыг хориглосон холбоос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Conflicting data.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryPatch"
            example:
              name: Веб хөгжүүлэлт
      description: Зөвхөн ирсэн талбарыг засна. Хоосон объект, үл мэдэгдэх талбар, зайнаас бүрдсэн
        текстийг 400 болгоно.
    delete:
      tags:
        - Categories
      summary: Category устгах
      operationId: deleteCategory
      responses:
        "204":
          description: Амжилттай устгалаа. Body хоосон.
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
        "409":
          description: Давхардсан утга эсвэл устгахыг хориглосон холбоос.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Conflicting data.
      parameters:
        - $ref: "#/components/parameters/Id"
      description: Сургалттай ангиллыг устгахгүй (Restrict), 409 буцаана.
  /instructors:
    get:
      tags:
        - Instructors
      summary: Instructor жагсаах
      operationId: listInstructors
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorList"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
    post:
      tags:
        - Instructors
      summary: Instructor нэмэх
      operationId: createInstructor
      responses:
        "201":
          description: Үүсгэлээ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InstructorCreate"
            example:
              name: Б. Тэмүүлэн
              birthYear: 1988
  /instructors/{id}:
    get:
      tags:
        - Instructors
      summary: Instructor дэлгэрэнгүй
      operationId: getInstructor
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstructorDetail"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
      parameters:
        - $ref: "#/components/parameters/Id"
    patch:
      tags:
        - Instructors
      summary: Instructor хэсэгчлэн засах
      operationId: updateInstructor
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Instructor"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
