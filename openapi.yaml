        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      description: Эцэг ангилал байхгүй бол 404. Бусад шүүлтүүрийг хамтад нь хэрэглэнэ.
  /instructors/{id}/courses:
    get:
      tags:
        - Instructors
      summary: Багшийн сургалтууд
      operationId: listInstructorCourses
      responses:
