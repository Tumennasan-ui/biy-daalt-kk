      description: Зөвхөн ирсэн талбарыг засна. Хоосон объект, үл мэдэгдэх талбар, зайнаас бүрдсэн
        текстийг 400 болгоно.
    delete:
      tags:
        - Instructors
      summary: Instructor устгах
      operationId: deleteInstructor
      responses:
        "204":
          description: Амжилттай устгалаа. Body хоосон.
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
        "404":
          description: Хаяг эсвэл өгөгдөл олдсонгүй.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Resource not found.
      parameters:
        - $ref: "#/components/parameters/Id"
      description: Багш устахад сургалтууд үлдэж instructorId null болно (SetNull).
  /courses:
    get:
      tags:
        - Courses
      summary: Course жагсаах
      operationId: listCourses
      responses:
        "200":
          description: Амжилттай.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseList"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
      parameters:
        - name: q
          in: query
          schema:
            type: string
            minLength: 1
            maxLength: 200
            pattern: \S
          description: title эсвэл description дотор хайна. Үсгийн том, жижиг ялгахгүй.
          example: javascript
        - name: categoryId
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
        - name: instructorId
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
        - name: hasInstructor
          in: query
          schema:
            type: boolean
          description: false бол багшгүй сургалтууд; зөвхөн true/false.
        - name: minYear
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1900
            maximum: 2027
          description: minYear <= maxYear байх ёстой.
        - name: maxYear
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1900
            maximum: 2027
        - name: isPublished
          in: query
          schema:
            type: boolean
          description: Зөвхөн true эсвэл false.
        - name: minRating
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 5
          description: "Нэмэлт: хичээлийн үнэлгээний дундаж энэ утгаас багагүй сургалтууд."
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - title
              - year
              - durationMin
              - createdAt
            default: createdAt
        - name: order
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
    post:
      tags:
        - Courses
      summary: Course нэмэх
      operationId: createCourse
      responses:
        "201":
          description: Үүсгэлээ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Course"
        "400":
          description: Буруу ID, query, JSON, body эсвэл foreign key.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                message: Invalid value.
                field: rating
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreate"
            example:
              title: JavaScript суурь
              year: 2026
              durationMin: 180
              description: Хувьсагч, функц, объектын үндсэн ойлголт.
              isPublished: true
              categoryId: 1
              instructorId: 1
  /courses/{id}:
    get:
      tags:
        - Courses
      summary: Course дэлгэрэнгүй
      operationId: getCourse
