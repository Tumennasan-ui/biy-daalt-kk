        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoursePatch"
            example:
              description: null
              isPublished: false
      description: Зөвхөн ирсэн талбарыг засна. Хоосон объект, үл мэдэгдэх талбар, зайнаас бүрдсэн
